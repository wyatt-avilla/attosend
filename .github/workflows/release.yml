name: Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read package version and check tag
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@v31
        if: steps.version.outputs.exists == 'false'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM for the NixOS test
        if: steps.version.outputs.exists == 'false'
        run: |
          sudo chmod 666 /dev/kvm
          echo 'system-features = nixos-test benchmark big-parallel kvm' | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
      - name: Validate release
        if: steps.version.outputs.exists == 'false'
        run: |
          nix build
          nix flake check
      - name: Create tag and release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag \
            --title "$RELEASE_TAG" --generate-notes
